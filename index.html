<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="referrer" content="no-referrer">
  <title>Mateus &amp; Amanda</title>
  <meta property="og:title" content="Mateus &amp; Amanda · 21 de novembro de 2026">
  <meta property="og:description" content="Confirme sua presença pelo link do seu convite.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500&family=Gentium+Book+Plus:ital@0;1&display=swap">
  <style>
    :root { --paper: #efede6; --ink: #2a2823; --muted: #6a6459; --gold: #a7823e; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: #f4f3ef; }
    body { display: flex; align-items: center; justify-content: center; padding: 24px 16px; color: var(--ink); font-family: "Gentium Book Plus", Georgia, serif; text-align: center; }
    .card { width: 100%; max-width: 440px; padding: 56px 28px 48px; background: var(--paper); border-radius: 3px; box-shadow: 0 1px 2px rgba(70, 55, 35, .08), 0 18px 40px -24px rgba(70, 55, 35, .35); }
    h1 { font-family: "Cormorant Garamond", serif; font-weight: 500; font-size: clamp(38px, 11vw, 52px); line-height: 1.05; letter-spacing: .12em; }
    .amp { display: block; margin: 4px 0 6px; color: var(--gold); letter-spacing: 0; }
    .date { margin-top: 22px; font-size: 15px; letter-spacing: .2em; text-transform: uppercase; }
    .rule { width: 56px; height: 1px; margin: 28px auto; background: var(--gold); }
    .note { font-size: 19px; line-height: 1.5; font-style: italic; color: var(--muted); }
    #status { margin-top: 18px; font-size: 15px; color: var(--muted); }
  </style>
</head>
<body>
  <main class="card">
    <h1>MATEUS<span class="amp">&amp;</span>AMANDA</h1>
    <p class="date">21 de novembro de 2026</p>
    <div class="rule"></div>
    <p class="note">Para confirmar sua presença, use o link ou o QR code do seu convite.</p>
    <p id="status"></p>
  </main>
  <script src="/go.js"></script>
</body>
</html>
